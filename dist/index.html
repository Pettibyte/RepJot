<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REP JOT Google Drive prototype</title>

</head>

<body>
  <div id="app">
    <p id="boot-status">Loading REP JOT…</p>
  </div>
  <script>
    (function () {
      'use strict';
      var finished = false;
      var status = document.getElementById('boot-status');

      function showFailure(details) {
        if (finished || !status) return;
        status.textContent = 'REP JOT could not start in this browser. ' + details;
      }

      window.addEventListener('error', function (event) {
        showFailure(event.message || 'A JavaScript error occurred.');
      });
      window.setTimeout(function () {
        showFailure('The application script did not finish loading.');
      }, 5000);

      window.__repjotBooted = function () {
        finished = true;
      };

      window.__repjotLoadApp = function (source) {
        var script = document.createElement('script');
        script.src = source;
        script.async = true;
        script.onerror = function () {
          showFailure('The application script could not be loaded.');
        };
        document.head.appendChild(script);
      };
    }());
  </script>
<script>window.__repjotLoadApp("./app.js?v=mtdfiskj");</script>
</body>

</html>
